<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LavenderLabs Onboarding</title>
    <link rel="stylesheet" href="/style.css">
    
</head>
<body>
    <div class="card">
        <h2>Staff Onboarding</h2>
        <form action="/register" method="POST">
            <label>Full Name</label>
            <input type="text" name="name" required placeholder="e.g. Anu Joseph">
            <label>Corporate Email</label>
            <input type="email" name="email" required placeholder="name@lavenderlabs.com">
            <label>Account Password</label>
            <input type="password" name="password" required minlength="4" placeholder="Min 4 characters">
            <button type="submit">Create Staff Account</button>
        </form>
        <p>Already onboarded? <a href="/login.html">Sign In Here</a></p>
    </div>
    <script src="/script.js"></script>

</body>
</html>
